<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylo Tupay | Peluquería & Barbería Profesional</title>
    <style>
        /* ==========================================
           1. VARIABLES CSS (SISTEMA DE TEMAS)
           ========================================== */
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2a2a2a;
            --accent-gold: #c4a468;
            --accent-gold-hover: #d8b87a;
            --text-main: #f1f1f1;
            --text-muted: #aaaaaa;
            --text-dark: #121212;
            --border-color: #333333;
            --whatsapp-color: #25d366;
            --whatsapp-hover: #20ba5a;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --banner-overlay: rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg-primary: #f4f4f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e4e4e7;
            --accent-gold: #b38e46;
            --accent-gold-hover: #967433;
            --text-main: #18181b;
            --text-muted: #52525b;
            --text-dark: #ffffff;
            --border-color: #d4d4d8;
            --card-shadow: rgba(0, 0, 0, 0.1);
            --banner-overlay: rgba(0, 0, 0, 0.65);
        }

        /* ==========================================
           2. ESTILOS GENERALES Y RESET
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 100px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2.section-title {
            text-align: center;
            color: var(--accent-gold);
            margin-bottom: 25px;
            margin-top: 50px;
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-gold);
            display: inline-block;
            width: 100%;
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================
           3. BOTÓN DE CAMBIO DE TEMA (CLARO/OSCURO)
           ========================================== */
        .theme-toggle-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
        }

        .theme-btn {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px var(--card-shadow);
        }

        /* ==========================================
           4. BANNER DE PORTADA PRINCIPAL (HERO)
           ========================================== */
        .hero-banner {
            position: relative;
            width: 100%;
            background: linear-gradient(var(--banner-overlay), var(--banner-overlay)), 
                        url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
            text-align: center;
            padding: 70px 20px 50px;
            border-bottom: 3px solid var(--accent-gold);
            box-shadow: 0 4px 20px var(--card-shadow);
        }

        .hero-title {
            font-size: 3.2rem;
            color: var(--accent-gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--text-main);
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-open {
            background-color: rgba(37, 211, 102, 0.2);
            color: #25d366;
            border: 1px solid #25d366;
        }

        .status-closed {
            background-color: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }

        .hero-banner .btn-whatsapp {
            display: block;
            width: fit-content;
            margin: 0 auto;
            background-color: var(--whatsapp-color);
            color: #ffffff;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .hero-banner .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-3px);
        }

        /* ==========================================
           5. NAVEGACIÓN RÁPIDA (ANCHOR LINKS)
           ========================================== */
        .quick-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .quick-nav-btn {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .quick-nav-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* ==========================================
           6. SECCIÓN VERSÍCULO BÍBLICO
           ========================================== */
        .verse-section {
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent-gold);
            border-right: 1px solid var(--border-color);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 25px;
            margin-bottom: 35px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px var(--card-shadow);
        }

        .verse-text {
            font-style: italic;
            font-size: 1.05rem;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .verse-ref {
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================
           7. SECCIÓN DE PROMOCIONES ESPECIALES
           ========================================== */
        .promo-section {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 25px 20px;
            margin-bottom: 35px;
            box-shadow: 0 4px 15px var(--card-shadow);
        }

        .promo-header {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .promo-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .promo-tag {
            background-color: #e63946;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .promo-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .promo-price {
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: bold;
            margin: 5px 0;
        }

        .old-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-right: 5px;
        }

        /* ==========================================
           8. SECCIÓN DE RESERVAS (CALENDLY)
           ========================================== */
        .booking-section {
            background: var(--bg-secondary);
            padding: 35px 25px;
            text-align: center;
            border-radius: 16px;
            margin-bottom: 40px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 20px var(--card-shadow);
        }

        .booking-section h2 {
            color: var(--text-main);
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .booking-section p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 25px;
        }

        .btn-calendly {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-gold-hover) 0%, var(--accent-gold) 100%);
            color: var(--text-dark);
            padding: 16px 36px;
            text-decoration: none;
            font-weight: 800;
            border-radius: 50px;
            font-size: 1.15rem;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(196, 164, 104, 0.4);
            transition: all 0.3s ease;
        }

        .btn-calendly:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(196, 164, 104, 0.6);
        }

        /* ==========================================
           9. BUSCADOR INTERACTIVO Y GRID DE SERVICIOS/PRODUCTOS
           ========================================== */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 25px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-gold);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px var(--card-shadow);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--card-shadow);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 8px 0;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .btn-pedir {
            background-color: var(--accent-gold);
            color: var(--text-dark);
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-pedir:hover {
            background-color: var(--accent-gold-hover);
            transform: scale(1.05);
        }

        /* ==========================================
           10. GALERÍA DE ESTILOS (PORTFOLIO CON FILTROS)
           ========================================== */
        .portfolio-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-gold);
            color: var(--text-dark);
            border-color: var(--accent-gold);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .portfolio-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            height: 220px;
            border: 1px solid var(--border-color);
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .portfolio-item:hover img {
            transform: scale(1.1);
        }

        .portfolio-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 15px 10px 10px;
            color: #ffffff;
            font-size: 0.85rem;
            text-align: center;
        }

        /* ==========================================
           11. NUEVA SECCIÓN: EQUIPO DE BARBEROS
           ========================================== */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px var(--card-shadow);
        }

        .team-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            border: 3px solid var(--accent-gold);
        }

        .team-name {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .team-role {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .team-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* ==========================================
           12. PLANES DE MEMBRESÍA MENSUAL
           ========================================== */
        .membership-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .membership-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        .membership-card.featured {
            border: 2px solid var(--accent-gold);
        }

        .membership-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-gold);
            color: var(--text-dark);
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .membership-price {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 15px 0;
        }

        .membership-features {
            list-style: none;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .membership-features li {
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
        }

        /* ==========================================
           13. COTIZADOR INTERACTIVO
           ========================================== */
        .calculator-section {
            background-color: var(--bg-secondary);
            padding: 30px 20px;
            border-radius: 12px;
            margin-top: 40px;
            border: 1px solid var(--border-color);
        }

        .calculator-section h3 {
            color: var(--accent-gold);
            margin-bottom: 15px;
            text-align: center;
        }

        .calc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .calc-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calc-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .total-box {
            margin-top: 20px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .total-box span {
            color: var(--accent-gold);
        }

        .btn-calc-wa {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 15px;
            background-color: var(--whatsapp-color);
            color: white;
            padding: 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn-calc-wa:hover {
            background-color: var(--whatsapp-hover);
        }

        /* ===================
