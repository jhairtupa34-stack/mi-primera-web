<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #2b6cb0;
      margin-bottom: 10px;
    }
    h2 {
      color: #4a5568;
      font-size: 1.1rem;
      font-weight: normal;
    }
    p {
      color: #718096;
      line-height: 1.5;
    }
    .btn {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #2b6cb0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>¡Hola! 👋</h1>
    <h2>Esta es mi primera página web</h2>
    <p>Estoy aprendiendo a crear páginas web y a personalizarlas con estilo.</p>
    <button class="btn">Contáctame</button>
  </div>

</body>
</html>
